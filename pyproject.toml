[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-productivity-toolkit"
version = "1.0.0"
description = "Module 2: Prompt Engineering & AI Productivity Toolkit (Day 6 - Day 10)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Premkumar S", email = "premkumarsenthiltvg@gmail.com"}
]
keywords = [
    "prompt-engineering",
    "few-shot-learning",
    "structured-outputs",
    "ai-productivity",
    "llm-workflows"
]
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "streamlit>=1.35.0",
    "pytest>=8.0.0",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1"
]

[project.scripts]
ai-toolkit = "day_10_productivity_toolkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
